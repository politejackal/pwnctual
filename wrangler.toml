# pwnctual.com is a static site: Cloudflare serves the files in public/ as they are.
# Deployed by .github/workflows/cloudflare.yml on every push to main.
name = "pwnctual"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [
  { pattern = "pwnctual.com", custom_domain = true },
  { pattern = "www.pwnctual.com", custom_domain = true },
]

[assets]
directory = "./public"
# Every page is drawn in the browser by public/js/app.js, so any path that isn't a file gets index.html.
not_found_handling = "single-page-application"
